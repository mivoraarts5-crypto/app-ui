name: Build & Release Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            (yes || true) | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository signing secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found; generating CI release keystore..."
            EPHEMERAL_PASS="android-ci-release"
            echo "::add-mask::$EPHEMERAL_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Tropical CI, OU=Mobile, O=Tropical, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release APK output
        id: apk
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Release APK not found at $APK_SRC"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="Tropical-${TAG}-${SHORT_SHA}-release.apk"
          cp "$APK_SRC" "${{ github.workspace }}/${APK_NAME}"
          echo "apk_path=${{ github.workspace }}/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.release_tag }}
          name: "Tropical ${{ steps.apk.outputs.release_tag }}"
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
